  <body>
    <div id="root"></div>
    <script>
      (function() {
        try {
          var ua = navigator.userAgent || '';
          var isAndroid = /Android/i.test(ua);
          var isInstagram = /Instagram|FBAN|FBAV/i.test(ua);
          if (isAndroid && isInstagram && !sessionStorage.getItem('chrome_intent_fired')) {
            sessionStorage.setItem('chrome_intent_fired', 'true');
            var chromeIntent = 'intent://' + window.location.host + window.location.pathname + window.location.search + '#Intent;scheme=https;package=com.android.chrome;end';
            window.location.href = chromeIntent;
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
